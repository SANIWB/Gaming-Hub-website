<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks - Gaming Hub</title><style>body{margin:0;background:#080b14;color:white;font-family:Arial}.container{max-width:520px;margin:auto;padding:18px}.card{background:#151c2b;border:1px solid #263244;border-radius:16px;padding:18px;margin:14px 0}button{width:100%;padding:13px;border:0;border-radius:10px;background:#374151;color:white;font-weight:bold}.coins{color:#facc15;font-weight:bold}.small{color:#9ca3af;font-size:13px}</style></head><body><div class="container"><button onclick="location.href='/'">← Dashboard</button><h2>🎯 Tasks</h2><div class="card"><h3>🎮 Daily Gaming Task</h3><p class="small">Complete today's gaming activity.</p><p class="coins">🪙 +10 Coins</p><button onclick="completeTask(this,'daily-gaming')">Complete Task</button></div><div class="card"><h3>🔥 Daily Bonus Task</h3><p class="small">Claim your daily virtual coin bonus.</p><p class="coins">🪙 +5 Coins</p><button onclick="completeTask(this,'daily-bonus')">Complete Task</button></div><div id="message"></div></div><script>async function completeTask(btn,taskId){const email=localStorage.getItem("gamingUserEmail");if(!email){alert("Please login first.");location.href="/login";return;}btn.disabled=true;try{const r=await fetch("/api/tasks/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,taskId})});const d=await r.json();if(!d.ok){alert(d.message);btn.disabled=false;return;}btn.textContent="Completed";document.getElementById("message").innerHTML="<div class='card'>Task completed! +"+d.reward+" coins<br>Balance: "+d.coins+"</div>";}catch(e){alert("Server error.");btn.disabled=false;}}</script></div></body></html>
