<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login - Gaming Hub</title>
<style>
body{margin:0;background:#080b14;color:white;font-family:Arial}
.container{max-width:400px;margin:80px auto;padding:20px}
.card{background:#151c2b;padding:25px;border-radius:16px}
input,button{width:100%;padding:13px;margin-top:12px;box-sizing:border-box;border-radius:9px;border:0}
input{background:#0f172a;color:white}
button{background:#2563eb;color:white;font-weight:bold}
#msg{margin-top:15px;color:#fca5a5}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>🔐 Admin Login</h1>
<input id="password" type="password" placeholder="Admin password">
<button onclick="login()">Login</button>
<div id="msg"></div>
</div>
</div>

<script>
function login(){
  const password=document.getElementById("password").value;

  fetch("/api/admin/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password})
  })
  .then(r=>r.json())
  .then(data=>{
    if(data.ok){
      sessionStorage.setItem("adminToken",data.token);
      location.href="/admin";
    }else{
      document.getElementById("msg").textContent=data.message;
    }
  });
}
</script>
</body>
</html>
