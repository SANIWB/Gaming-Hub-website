<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Coin History</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:white;font-family:Arial}
.container{max-width:520px;margin:auto;padding:20px}
.card{background:#151c2b;border:1px solid #263244;border-radius:14px;padding:16px;margin:12px 0}
.add{color:#4ade80}
.remove{color:#f87171}
.small{color:#9ca3af;font-size:13px;margin-top:6px}
button{width:100%;padding:12px;border:0;border-radius:9px;background:#374151;color:white;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>📜 Coin History</h1>
<button onclick="location.href='/admin'">← Admin</button>
<div id="history">Loading...</div>
</div>

<script>
const token=sessionStorage.getItem("adminToken");

if(!token){
  location.href="/admin-login";
}

async function loadHistory(){
  const r=await fetch("/api/admin/coin-history",{
    headers:{"x-admin-token":token}
  });

  if(r.status===401){
    sessionStorage.removeItem("adminToken");
    location.href="/admin-login";
    return;
  }

  const data=await r.json();
  const box=document.getElementById("history");

  if(!data.logs.length){
    box.innerHTML="<p>No coin history yet.</p>";
    return;
  }

  box.innerHTML=data.logs.map(log=>{
    const positive=log.amount>0;
    return `
      <div class="card">
        <b>👤 ${log.username}</b>
        <div class="small">${log.email}</div>
        <p class="${positive?'add':'remove'}">
          ${positive?'➕':'➖'} ${Math.abs(log.amount)} coins
        </p>
        <div>🪙 ${log.oldCoins} → ${log.newCoins}</div>
        <div class="small">${new Date(log.time).toLocaleString()}</div>
      </div>
    `;
  }).join("");
}

loadHistory();
</script>
</body>
</html>
