<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaming Hub Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:#fff;font-family:Arial}
.container{max-width:600px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
h1{margin:0;font-size:24px}
.card{background:#151c2b;border:1px solid #263244;border-radius:16px;padding:16px;margin:12px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#101827;border-radius:14px;padding:14px}
.label{color:#9ca3af;font-size:13px}
.value{font-size:24px;font-weight:bold;margin-top:5px}
.email{color:#9ca3af;font-size:13px;word-break:break-all}
.coins{font-size:21px;font-weight:bold;margin:8px 0}
input,button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px}
input{background:#0f172a;color:white;border:1px solid #263244}
button{background:#2563eb;color:white;font-weight:bold}
.red{background:#dc2626}
.gray{background:#374151}
.logout{background:#7f1d1d;width:auto;margin:0;padding:9px 12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg{color:#86efac;font-size:13px;margin-top:8px}
</style>
</head>

<body>
<div class="container">

<header>
<div>
<h1>🛠️ Gaming Hub</h1>
<div style="color:#9ca3af;font-size:13px">Admin Control Panel</div>
</div>
<button class="logout" onclick="logout()">Logout</button>
</header>

<div class="actions">
<button class="gray" onclick="location.href='/dashboard'">← Dashboard</button>
<button onclick="refreshAll()">🔄 Refresh</button>
</div>

<div id="summary" class="stats" style="margin-top:14px">
<div class="stat"><div class="label">👥 Users</div><div class="value">...</div></div>
<div class="stat"><div class="label">🪙 Total Coins</div><div class="value">...</div></div>
<div class="stat"><div class="label">➕ Added Today</div><div class="value">...</div></div>
<div class="stat"><div class="label">➖ Removed Today</div><div class="value">...</div></div>
</div>

<div class="card">
<input id="search" placeholder="🔎 Search username or email" oninput="filterUsers()">
</div>

<div id="users">Loading users...</div>

</div>

<script>
const token=sessionStorage.getItem("adminToken");
let users=[];

if(!token) location.href="/admin-login";

async function api(url,options={}){
  options.headers={
    ...(options.headers||{}),
    "x-admin-token":token
  };

  const r=await fetch(url,options);

  if(r.status===401){
    sessionStorage.removeItem("adminToken");
    location.href="/admin-login";
    return null;
  }

  return r.json();
}

async function loadSummary(){
  const d=await api("/api/admin/summary");
  if(!d||!d.ok)return;

  document.getElementById("summary").innerHTML=`
    <div class="stat"><div class="label">👥 Users</div><div class="value">${d.totalUsers}</div></div>
    <div class="stat"><div class="label">🪙 Total Coins</div><div class="value">${d.totalCoins}</div></div>
    <div class="stat"><div class="label">➕ Added Today</div><div class="value">${d.addedToday}</div></div>
    <div class="stat"><div class="label">➖ Removed Today</div><div class="value">${d.removedToday}</div></div>
  `;
}

async function loadUsers(){
  const d=await api("/api/admin/users");
  if(!d||!d.ok)return;

  users=d.users;
  renderUsers(users);
}

function renderUsers(list){
  const box=document.getElementById("users");

  if(!list.length){
    box.innerHTML="<div class='card'>No users found.</div>";
    return;
  }

  box.innerHTML="";

  list.forEach((u,i)=>{
    box.innerHTML+=`
      <div class="card">
        <h3>👤 ${u.username}</h3>
        <div class="email">${u.email}</div>
        <div class="coins">🪙 ${u.coins}</div>

        <input id="amount-${i}" type="number" min="1" placeholder="Coin amount">

        <div class="actions">
          <button onclick="changeCoins(${i},1)">➕ Add</button>
          <button class="red" onclick="changeCoins(${i},-1)">➖ Remove</button>
        </div>

        <button class="gray" onclick="viewUser('${encodeURIComponent(u.email)}')">
          👤 View Details
        </button>

        <div class="msg" id="msg-${i}"></div>
      </div>
    `;
  });
}

async function changeCoins(index,direction){
  const input=document.getElementById("amount-"+index);
  const amount=Number(input.value);

  if(!Number.isInteger(amount)||amount<=0){
    alert("Enter a valid whole coin amount.");
    return;
  }

  const email=users[index].email;
  const action=direction>0?"add":"remove";

  if(!confirm(`Are you sure you want to ${action} ${amount} coins?`))
    return;

  const d=await api("/api/admin/coins",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      email:email,
      amount:amount*direction
    })
  });

  if(!d)return;

  if(!d.ok){
    alert(d.message);
    return;
  }

  document.getElementById("msg-"+index).textContent=
    "✅ "+d.message+" New balance: "+d.coins;

  input.value="";

  await loadSummary();
  await loadUsers();
}

function filterUsers(){
  const q=document.getElementById("search").value.toLowerCase().trim();

  if(!q){
    renderUsers(users);
    return;
  }

  renderUsers(users.filter(u=>
    u.username.toLowerCase().includes(q) ||
    u.email.toLowerCase().includes(q)
  ));
}

function viewUser(email){
  location.href="/user-details?email="+email;
}

function logout(){
  sessionStorage.removeItem("adminToken");
  location.href="/admin-login";
}

async function refreshAll(){
  await loadSummary();
  await loadUsers();
}

refreshAll();
</script>

</body>
</html>
