<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>User Details</title>
<style>
body{margin:0;background:#080b14;color:white;font-family:Arial}
.container{max-width:520px;margin:auto;padding:20px}
.card{background:#151c2b;border:1px solid #263244;border-radius:14px;padding:16px;margin:12px 0}
button{width:100%;padding:12px;border:0;border-radius:9px;background:#374151;color:white;font-weight:bold}
.coins{font-size:30px;font-weight:bold}
.small{color:#9ca3af;font-size:13px}
.add{color:#4ade80}.remove{color:#f87171}
</style>
</head>
<body>
<div class="container">
<button onclick="location.href='/admin'">← Admin</button>
<div id="app">Loading...</div>
</div>
<script>
const token=sessionStorage.getItem("adminToken");
if(!token) location.href="/admin-login";

const email=new URLSearchParams(location.search).get("email");

async function load(){
 const r=await fetch("/api/admin/user-details?email="+encodeURIComponent(email),{
   headers:{"x-admin-token":token}
 });
 const d=await r.json();

 if(!d.ok){
   document.getElementById("app").innerHTML="<div class='card'>❌ "+d.message+"</div>";
   return;
 }

 const u=d.user;

 document.getElementById("app").innerHTML=`
 <div class="card">
   <h2>👤 ${u.username}</h2>
   <div class="small">${u.email}</div>
   <p>🪙 Coins</p>
   <div class="coins">${u.coins}</div>
 </div>

 <div class="card">
   <h3>🎯 Completed Tasks</h3>
   <p>${u.completedTasks.length}</p>
 </div>

 <div class="card">
   <h3>🎁 Redeemed Rewards</h3>
   <p>${u.rewards.length}</p>
 </div>

 <h3>📜 Coin History</h3>
 ${u.coinHistory.length ? u.coinHistory.map(x=>`
   <div class="card">
     <b>${x.username}</b>
     <p class="${x.amount>0?'add':'remove'}">
       ${x.amount>0?'➕':'➖'} ${Math.abs(x.amount)} coins
     </p>
     <div>🪙 ${x.oldCoins} → ${x.newCoins}</div>
     <div class="small">${new Date(x.time).toLocaleString()}</div>
   </div>
 `).join("") : "<div class='card'>No coin history yet.</div>"}
 `;
}
load();
</script>
</body>
</html>
